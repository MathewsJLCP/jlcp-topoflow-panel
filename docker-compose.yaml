services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    # O ID do plugin mudou de jlcp- para mdomingos- (prefixo = slug da org no
    # grafana.com). .config/ é gerado pelo create-plugin e ainda traz o ID antigo;
    # sobrescrevemos aqui. O volume fica como está: o nome da pasta não importa
    # para o Grafana, e um segundo volume carregaria o plugin duas vezes.
    container_name: 'mdomingos-topoflow-panel'
    environment:
      GF_LOG_FILTERS: plugin.mdomingos-topoflow-panel:debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mdomingos-topoflow-panel
